[project]
name = "zero-sim"
version = "0.1.0"
description = "ZeRO Distributed Training Simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "ty>=0.9",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zero_sim*"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
lint.ignore = [
    "T201",  # print statements allowed in demo code
]
format.quote-style = "double"
format.indent-style = "space"